<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Oceania TV Streaming App">
    <title>Oceania TV Streaming App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Oceania TV Streaming App</h1>
        <button id="backButton">Go Back</button>
    </header>
    <main>
        <div id="errorLog" style="display:none;"></div>
        <div id="streamContainer">
            <!-- Stream content will be dynamically loaded here -->
        </div>
    </main>
    <script>
        // Back Button Handler
        document.getElementById('backButton').addEventListener('click', function() {
            window.history.back();
        });

        // Error Logging
        function logError(error) {
            const errorLog = document.getElementById('errorLog');
            errorLog.innerHTML += `<p>${error}</p>`;
            errorLog.style.display = 'block';
        }

        // Example of null check before using a variable
        let streamData = null; // Assume this gets populated later
        if (streamData) {
            // Process stream data
        } else {
            logError('Stream data is null');
        }
    </script>
</body>
</html>
