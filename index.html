<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Back Button Handler Fix">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button id="backButton">Back</button>
    <script>
        let backButton = document.getElementById('backButton');
        let stack = [];

        backButton.addEventListener('click', function() {
            if (stack.length > 0) {
                // Process the last stack item
                let lastAction = stack.pop();
                console.log('Going back to:', lastAction);
                // Add your navigation logic here
            } else {
                console.error('No previous pages in stack.');
            }
        });

        // Function to log errors
        function logError(message) {
            console.error(message);
            // Additional logging logic (e.g., send to server)
        }

        // Example of null check
        let someVariable = null;
        if (someVariable === null) {
            logError('someVariable is null.');
        }
    </script>
</body>
</html>
