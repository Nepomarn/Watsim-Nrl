<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>AU/NZ Live TV</title>
    <link rel="icon" href="data:,">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; }
        html, body { 
            width: 100%; 
            height: 100%; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg); 
            color: var(--text); 
            overflow: hidden;
        }
        body.fullscreen-active {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }
        header { 
            text-align: center; 
            padding: 15px;
            flex-shrink: 0;
            background: var(--bg);
            border-bottom: 1px solid #1e293b;
        }
        header h1 { 
            font-size: 1.5rem; 
            margin-bottom: 8px;
        }
        .region-info { 
            font-size: 0.85rem; 
            color: var(--accent); 
            font-weight: 600; 
        }
        #player-container { 
            display: none; 
            width: 100%; 
            background: #000; 
            flex-shrink: 0;
            position: relative;
            z-index: 100;
        }
        #player-container.active {
            display: flex;
            flex-direction: column;
        }
        #player-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
        }
        #player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        #p-title { 
            padding: 12px; 
            background: #1a1a2e;
            font-weight: 600; 
            text-align: center; 
            font-size: 0.95rem; 
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .fullscreen-toggle {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .fullscreen-toggle:active {
            opacity: 0.8;
        }
        .content-wrapper {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 15px;
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); 
            gap: 12px;
        }
        .card { 
            background: var(--card); 
            padding: 12px; 
            border-radius: 10px; 
            text-align: center; 
            cursor: pointer; 
            transition: 0.2s; 
            border: 2px solid transparent; 
            position: relative;
            -webkit-user-select: none;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 120px;
        }
        .card:active { 
            border-color: var(--accent); 
            transform: scale(0.95);
            background: #26334d;
        }
        .card img { 
            width: 60px; 
            height: 60px; 
            object-fit: contain; 
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 6px; 
            padding: 6px; 
            margin-bottom: 10px;
            flex-shrink: 0;
            aspect-ratio: 1;
        }
        .card img.error-icon {
            background: var(--accent);
            opacity: 0.6;
        }
        .card p { 
            margin: 0; 
            font-size: 0.75rem; 
            font-weight: 600; 
            line-height: 1.2;
            word-break: break-word;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .badge { 
            position: absolute; 
            top: 6px; 
            right: 6px; 
            font-size: 0.6rem; 
            background: var(--accent); 
            color: #000; 
            padding: 2px 4px; 
            border-radius: 3px; 
            text-transform: uppercase;
            font-weight: 700;
        }
        .loading { 
            text-align: center; 
            padding: 40px 15px; 
            color: var(--accent); 
            font-style: italic;
            font-size: 0.9rem;
        }
        .close-player {
            background: transparent;
            border: none;
            color: var(--text);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 4px 8px;
            -webkit-user-select: none;
            user-select: none;
        }
        @media (max-height: 500px) {
            #player-wrapper { padding-bottom: 45%; }
        }
    </style>
</head>
<body>
    <div id="app-container">
        <header>
            <h1>📺 Oceania TV</h1>
            <p class="region-info" id="status-text">Fetching channels...</p>
        </header>

        <div id="player-container">
            <div id="p-title">
                <span id="channel-name">Select a Channel</span>
                <button class="fullscreen-toggle" id="fs-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
                <button class="close-player" onclick="closePlayer()">✕</button>
            </div>
            <div id="player-wrapper">
                <iframe id="main-ifr" src="" allowfullscreen allow="encrypted-media; fullscreen"></iframe>
            </div>
        </div>

        <div class="content-wrapper">
            <div id="loader" class="loading">🛰️ Scanning Satellite...</div>
            <div class="grid" id="channel-grid"></div>
        </div>
    </div>

    <script>
        // Initialize Telegram Web App
        if (window.Telegram?.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            tg.enableClosingConfirmation();
        }

        // API and Proxy config
        const API_URL = 'https://api.cdnlivetv.tv/api/v1/channels/?user=cdnlivetv&plan=free';
        const PROXY = 'https://corsproxy.io/?';
        
        let isFullscreen = false;

        // Generate SVG fallback icon
        function getGenericTVIcon() {
            const svg = `<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\" width=\"60\" height=\"60\">\n                <rect x=\"10\" y=\"15\" width=\"80\" height=\"60\" fill=\"none\" stroke=\"white\" stroke-width=\"2\" rx=\"3\"/>\n                <rect x=\"20\" y=\"25\" width=\"60\" height=\"40\" fill=\"none\" stroke=\"white\" stroke-width=\"1.5\"/>\n                <path d=\"M 30 70 L 25 80 L 35 80 Z\" fill=\"white\"/>\n                <path d=\"M 70 70 L 65 80 L 75 80 Z\" fill=\"white\"/>\n                <path d=\"M 50 70 L 45 80 L 55 80 Z\" fill=\"white\"/>\n            </svg>`;
            return 'data:image/svg+xml;base64,' + btoa(svg);
        }

        async function fetchChannels() {
            const loader = document.getElementById('loader');
            const statusText = document.getElementById('status-text');
            
            try {
                const response = await fetch(PROXY + encodeURIComponent(API_URL));
                if (!response.ok) throw new Error("CORS Proxy Failure");
                
                const data = await response.json();
                
                const oceaniaChannels = (data.channels || []).filter(ch => {
                    const code = ch.code ? ch.code.toLowerCase() : '';
                    return code === 'au' || code === 'nz';
                });

                loader.style.display = 'none';
                statusText.innerText = `🟢 Online: ${oceaniaChannels.length} Channels in AU & NZ`;
                
                renderGrid(oceaniaChannels);
            } catch (err) {
                loader.innerText = "❌ Error loading channels. Try refreshing.";
                statusText.innerText = "Connection Failed";
                console.error("Fetch error:", err);
            }
        }

        function renderGrid(channels) {
            const grid = document.getElementById('channel-grid');
            grid.innerHTML = '';

            if (channels.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 20px;">No channels currently available for AU/NZ region.</p>';
                return;
            }

            channels.forEach(ch => {
                if (!ch.url || ch.url === "null") return;

                const card = document.createElement('div');
                card.className = 'card';

                const badge = document.createElement('span');
                badge.className = 'badge';
                badge.textContent = ch.code;

                const img = document.createElement('img');
                const imageUrl = ch.image && String(ch.image).toLowerCase() !== 'null' && ch.image.length > 0 ? ch.image : null;
                
                if (imageUrl && imageUrl.startsWith('http')) {
                    img.src = imageUrl;
                } else {
                    img.src = getGenericTVIcon();
                    img.classList.add('error-icon');
                }
                
                img.loading = "lazy";
                img.onerror = function() {
                    this.src = getGenericTVIcon();
                    this.classList.add('error-icon');
                };

                const name = document.createElement('p');
                name.textContent = ch.name;

                card.appendChild(badge);
                card.appendChild(img);
                card.appendChild(name);

                card.addEventListener('click', () => playChannel(ch));
                card.addEventListener('touchstart', () => card.style.opacity = '0.7');
                card.addEventListener('touchend', () => card.style.opacity = '1');

                grid.appendChild(card);
            });
        }

        function playChannel(ch) {
            const container = document.getElementById('player-container');
            const iframe = document.getElementById('main-ifr');
            const title = document.getElementById('channel-name');

            title.textContent = `${ch.name} (${ch.code.toUpperCase()})`;
            iframe.src = ch.url;
            container.classList.add('active');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            if (window.Telegram?.WebApp) {
                window.Telegram.WebApp.HapticFeedback?.impactOccurred?.('light');
            }
        }

        function closePlayer() {
            const container = document.getElementById('player-container');
            const iframe = document.getElementById('main-ifr');
            container.classList.remove('active');
            iframe.src = '';
            isFullscreen = false;
            document.body.classList.remove('fullscreen-active');
        }

        function toggleFullscreen() {
            const container = document.getElementById('player-container');
            const btn = document.getElementById('fs-btn');
            
            if (!isFullscreen) {
                if (container.requestFullscreen) {
                    container.requestFullscreen().catch(err => {
                        console.log('Fullscreen request failed:', err);
                        fallbackFullscreen(true);
                    });
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else {
                    fallbackFullscreen(true);
                }
                isFullscreen = true;
                btn.textContent = '⛶ Exit';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else {
                    fallbackFullscreen(false);
                }
                isFullscreen = false;
                btn.textContent = '⛶ Fullscreen';
            }
        }

        function fallbackFullscreen(enable) {
            const body = document.body;
            const container = document.getElementById('player-container');
            if (enable) {
                body.classList.add('fullscreen-active');
                document.getElementById('app-container').style.overflow = 'hidden';
            } else {
                body.classList.remove('fullscreen-active');
                document.getElementById('app-container').style.overflow = 'auto';
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const btn = document.getElementById('fs-btn');
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                isFullscreen = false;
                btn.textContent = '⛶ Fullscreen';
                document.body.classList.remove('fullscreen-active');
            }
        });

        // Initialize
        fetchChannels();
    </script>
</body>
</html>
